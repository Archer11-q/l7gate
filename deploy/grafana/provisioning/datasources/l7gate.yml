# S5-03：Grafana 的数据源（契约 9.1 锁 `grafana/grafana:10.4.2`，禁 `latest`）。
#
# URL 走的是本会话实测过的那条通路：容器 → 宿主上被 `-p` 发布出来的端口。
# 原先这里写「不写 `prometheus:9090` 那种服务名——那假设容器之间能按名字解析」，并把拓扑留给
# S5-05 实测决定。**S5-05 的量到了**：compose 自己声明的用户自定义网络里，服务名解析**通**
# （容器内 `nameserver 127.0.0.11`、`Aliases` 就是服务名、第一次尝试就拿到 200）——所以那句
# 「假设」在这一栈里其实是成立的，它不成立的是**默认 bridge**（`docker run` 不带 --network 那一条）。
# 这一行仍然不改：走发布端口在两种编排下都成立，而换成服务名会把这份配置绑死在 compose 网络上，
# 冒烟 `smoke-s5-03.sh`（网关与 exporter 跑在宿主上）就不再能用同一份入库配置。
# 反过来必须记住的一条是：**网关自己不做名字解析**（地址走 inet_pton），所以编排里凡是被
# 网关引用的地址都写成静态 IPv4——那才是 S5-05 的真正形状，见 ADR-27。
apiVersion: 1

datasources:
  - name: L7Gate-Prometheus
    uid: l7gate-prom
    type: prometheus
    access: proxy
    url: http://host.docker.internal:19090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
